name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cute_mafia
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: cute_mafia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cute_mafia -d cute_mafia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test SQLite and PostgreSQL
        working-directory: backend
        env:
          POSTGRES_TEST_DSN: postgres://cute_mafia:test-password@127.0.0.1:5432/cute_mafia_test?sslmode=disable
        run: go test ./...
      - name: Build Linux/amd64
        run: scripts/build-backend.sh
      - name: Compress API binary
        run: xz -T0 -9 dist/cute-mafia-api
      - name: Upload API artifact
        id: api-artifact
        uses: actions/upload-artifact@v4
        with:
          name: cute-mafia-api-${{ github.sha }}
          path: dist/cute-mafia-api.xz
          retention-days: 1
          compression-level: 0
      - name: Check VPS deployment configuration
        id: deploy-config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$SSH_PRIVATE_KEY" ] && [ -n "$VPS_KNOWN_HOSTS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure SSH
        if: ${{ steps.deploy-config.outputs.enabled == 'true' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy API with health-check rollback
        if: ${{ steps.deploy-config.outputs.enabled == 'true' }}
        env:
          ARTIFACT_ID: ${{ steps.api-artifact.outputs.artifact-id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: deploy
        run: |
          artifact_url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          printf 'header = "Authorization: Bearer %s"\nheader = "X-GitHub-Api-Version: 2022-11-28"\n' "$GITHUB_TOKEN" |
            ssh "$VPS_USER@$VPS_HOST" "curl --fail --silent --show-error --location --config - '$artifact_url' -o /tmp/cute-mafia-api.zip"
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p /tmp/cute-mafia-api-artifact && python3 -m zipfile -e /tmp/cute-mafia-api.zip /tmp/cute-mafia-api-artifact && xz -dc /tmp/cute-mafia-api-artifact/cute-mafia-api.xz > /tmp/cute-mafia-api.new && chmod 0755 /tmp/cute-mafia-api.new && unlink /tmp/cute-mafia-api.zip && unlink /tmp/cute-mafia-api-artifact/cute-mafia-api.xz && rmdir /tmp/cute-mafia-api-artifact'
          ssh "$VPS_USER@$VPS_HOST" sudo /usr/local/sbin/deploy-cute-mafia

  frontend:
    needs: api
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.cute-mafia.ru
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v5
